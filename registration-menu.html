<!DOCTYPE html>
<html lang="en">
<head>

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <meta charset="UTF-8">

</head>
<body>
    <div class="wrapper">
        <header class="container">
                <span class="logo">Туризм.ру</span>
                <nav>
                    <ul>
                        <li class="button"><a href="index.html">Главная страница</a></li>
                        <li class="button"><a href="visit.html">Путешествие</a></li>
                        <li class="activate"><a href="registration-menu.html">Регистрация</a></li>
                    </ul>
                </nav>
            </header>
            
    <div id="wrapper">
  <div class="registration-menu">
    <h2>Регистрация</h2>
    <form id="registrationForm">
      <div class="form-group">
        <label for="username">Имя пользователя:</label>
        <input type="text" id="username" name="username" required />
        <i class='bx bx-user-pin'></i>
      </div>

      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />
        <i class='bx bx-envelope' ></i>
      </div>

      <div class="form-group">
        <label for="password">Пароль:</label>
        <input type="password" id="password" name="password" required />
        <i class='bx bxs-key'></i>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Подтвердите пароль:</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required />
        <i class='bx bxs-keyboard' ></i>
      </div>

      <button type="submit">Зарегистрироваться</button>
    </form>
    <div class="remember">
        <label for="rememberMe">Запомнить меня</label>
        <input type="checkbox" id="rememberMe" name="rememberMe">
    </div>
    <div class="remember">
      <a href="#">Забыли пароль?</a>
    </div>
    <p>
      Уже есть аккаунт?
      <a href="#" id="loginLink">Войти</a>
    </p>
    </div>
    </div>
    <footer>
        Подвал &copy;
    </footer>
    </div>
</div>
